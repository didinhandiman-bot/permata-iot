server {
    listen 80;
    listen [::]:80;
    server_name permata-iot.bppmhkp.online;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name permata-iot.bppmhkp.online;

    # --- SSL Certificates (Let's Encrypt) ---
    ssl_certificate /etc/letsencrypt/live/permata-iot.bppmhkp.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/permata-iot.bppmhkp.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- General Settings ---
    client_max_body_size 50M;
    chunked_transfer_encoding off;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Logging ---
    access_log /var/log/nginx/permata-iot-access.log;
    error_log /var/log/nginx/permata-iot-error.log;

    # --- Reverse Proxy to Laravel Backend ---
    location / {
        proxy_pass http://192.168.9.140:8001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets
        location ~* \.(css|js|woff2|ttf|png|jpg|jpeg|gif|ico)$ {
            proxy_pass http://192.168.9.140:8001;
            proxy_cache_valid 200 30m;
        }
    }
}
